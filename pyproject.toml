# Solo configuracion de herramientas de desarrollo; el proyecto no se publica
# como paquete (la distribucion es el EXE de tools/build_windows.ps1).
# El lint (ruff) se configura en ruff.toml.

[tool.mypy]
python_version = "3.13"
# El lector de memoria usa APIs ctypes exclusivas de Windows (WinDLL,
# WinError); CI ejecuta mypy en Linux, asi que se fija la plataforma.
platform = "win32"
files = [
    "tracker/process_memory.py",
    "tracker/layout_export.py",
    "tracker/sprite_images.py",
    "tracker/progress.py",
    "tracker/templates.py",
    "companion/room.py",
    "companion/room_storage.py",
    "companion/snapshot.py",
    "companion/direct.py",
    "companion/sync.py",
]
# Los modulos importados (pokemon, boxes, profiles) aun no tienen tipos:
# se siguen para resolver nombres, pero sus errores no se informan.
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "tracker.process_memory",
    "tracker.layout_export",
    "tracker.sprite_images",
    "tracker.progress",
    "tracker.templates",
    "companion.room",
    "companion.room_storage",
    "companion.snapshot",
    "companion.direct",
    "companion.sync",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
