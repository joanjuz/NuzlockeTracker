name: Windows - App de escritorio

on:
  workflow_dispatch:
  push:
    branches: [feature/app-escritorio-windows, feature/obs-overlays-locales]
  pull_request:
    branches: [development, master]
    paths:
      - "desktop.py"
      - "requirements-desktop.txt"
      - "requirements-desktop.lock"
      - "server.py"
      - "tracker/**"
      - "companion/**"
      - "data/**"
      - "web/**"
      - "tests/test_desktop.py"
      - "tools/build_windows.ps1"
      - "tools/Diagnostico_Gen6.*"
      - "docs/DESKTOP_WINDOWS.md"
      - ".github/workflows/windows-desktop.yml"

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: x64
      - name: Instalar dependencias de escritorio
        run: python -m pip install --require-hashes -r requirements-desktop.lock
      - name: Pruebas Python
        run: python -m unittest discover -s tests -v
      - name: Compilar EXE Windows y paquete limpio
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\tools\build_windows.ps1
      - name: Comprobar contenido de distribucion
        shell: powershell
        run: |
          if (-not (Test-Path '.\out\PokemonTracker-Windows-x64.zip')) { throw 'Falta el ZIP' }
          if (Test-Path '.\dist\Iniciar.bat') { throw 'El paquete contiene BAT' }
          if (Test-Path '.\dist\tests') { throw 'El paquete contiene tests' }
          if (-not (Test-Path '.\dist\PokemonTracker.exe')) { throw 'Falta el EXE' }
      - name: Publicar ZIP para pruebas Windows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PokemonTracker-Windows-x64-onefile
          path: |
            dist/PokemonTracker.exe
            dist/LICENSE.txt
            dist/LEEME.txt
          retention-days: 14
          if-no-files-found: error

      - name: Compilar diagnóstico Gen6 independiente
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean --console --onefile --name Diagnostico_Gen6 --paths . tools/Diagnostico_Gen6.py
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo compilar el diagnóstico Gen6' }
          Copy-Item tools\Diagnostico_Gen6.bat dist\Diagnostico_Gen6.bat
          Copy-Item docs\DIAGNOSTICO_GEN6.md dist\LEEME_Diagnostico_Gen6.txt
          if (-not (Test-Path dist\Diagnostico_Gen6.exe)) { throw 'Falta el EXE Gen6' }
      - name: Publicar diagnóstico Gen6 Windows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PokemonTracker-Diagnostico-Gen6-Windows
          path: |
            dist/Diagnostico_Gen6.exe
            dist/Diagnostico_Gen6.bat
            dist/LEEME_Diagnostico_Gen6.txt
            dist/LICENSE.txt
          retention-days: 14
          if-no-files-found: error
