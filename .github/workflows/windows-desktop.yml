name: Windows - App de escritorio

on:
  workflow_dispatch:
  pull_request:
    branches: [development, master]
    paths:
      - "desktop.py"
      - "requirements-desktop.txt"
      - "server.py"
      - "tracker/**"
      - "companion/**"
      - "data/**"
      - "web/**"
      - "tests/test_desktop.py"
      - "tools/build_windows.ps1"
      - "docs/DESKTOP_WINDOWS.md"
      - ".github/workflows/windows-desktop.yml"

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
      - name: Pruebas Python
        run: python -m unittest discover -s tests -v
      - name: Compilar EXE Windows y paquete limpio
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\tools\build_windows.ps1
      - name: Comprobar contenido de distribucion
        shell: powershell
        run: |
          if (-not (Test-Path '.\out\PokemonTracker-Windows-x64.zip')) { throw 'Falta el ZIP' }
          if (Test-Path '.\dist\PokemonTracker\Iniciar.bat') { throw 'El paquete contiene BAT' }
          if (Test-Path '.\dist\PokemonTracker\tests') { throw 'El paquete contiene tests' }
          if (-not (Test-Path '.\dist\PokemonTracker\PokemonTracker.exe')) { throw 'Falta el EXE' }
      - name: Publicar ZIP para pruebas Windows
        uses: actions/upload-artifact@v4
        with:
          name: PokemonTracker-Windows-x64
          path: out/PokemonTracker-Windows-x64.zip
          retention-days: 14
          if-no-files-found: error
