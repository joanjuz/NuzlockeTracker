name: Pruebas Pokemon Tracker
on:
  push:
    branches: [master, development, 'release/**', feature/obs-overlays-locales]
  pull_request:
    branches: [master, development]
permissions:
  contents: read
jobs:
  lint:
    name: Lint (ruff) y tipos (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      # Versiones fijas: una version nueva de ruff/mypy no debe romper CI sin
      # un cambio en el repositorio. Configuracion en ruff.toml y pyproject.toml.
      - name: Instalar ruff y mypy
        run: python -m pip install "ruff==0.17.3" "mypy==2.4.1"
      - name: Ruff (solo errores reales F y E9)
        run: python -m ruff check . --output-format github
      - name: Mypy (módulos tipados en pyproject.toml)
        run: python -m mypy

  tests:
    name: Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Instalar dependencia de imágenes para pruebas de layout
        run: python -m pip install "Pillow>=11.0,<13.0"
      - name: Pruebas Python
        run: python -m unittest discover -s tests -v
      - name: Pruebas JavaScript
        run: |
          status=0
          for file in tests/test_*.js; do
            node "$file" || { echo "::error file=$file::Fallo $file"; status=1; }
          done
          exit $status
      - name: Pruebas Cloudflare Worker (SQL local)
        run: node --test cloudflare/companion-worker/tests.mjs

  # Navegador real (Chromium) contra `server.py --demo`: pestañas, diálogo de
  # detalle con teclado, CSP y overlay OBS transparente. tests/e2e/ se omite en
  # el trabajo `tests` (sin Playwright); aquí se ejecuta con E2E=1.
  e2e:
    name: E2E navegador (Playwright, demo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Instalar Playwright y Pillow (versiones fijas con hash)
        run: python -m pip install --require-hashes -r requirements-e2e.txt
      - name: Instalar Chromium y sus dependencias del sistema
        run: python -m playwright install --with-deps chromium
      # Sin Playwright las pruebas se omitirían en silencio: fallar antes.
      - name: Comprobar que Playwright se importa
        run: python -c "import playwright.sync_api"
      - name: Pruebas E2E
        env:
          E2E: '1'
          E2E_ARTIFACTS: build/e2e-artifacts
        run: python -m unittest discover -s tests/e2e -v
      - name: Subir capturas y registro del servidor si falla
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-capturas
          path: build/e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7
