name: Pruebas Pokemon Tracker
on:
  push:
    branches: [master, development, feature/obs-overlays-locales]
  pull_request:
    branches: [master, development]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencia de imágenes para pruebas de layout
        run: python -m pip install "Pillow>=11.0,<13.0"
      - name: Pruebas Python
        run: python -m unittest discover -s tests -v
      - name: Pruebas JavaScript
        run: |
          for file in tests/*.js; do node "$file"; done
      - name: Pruebas Cloudflare Worker (SQL local)
        run: node --test cloudflare/companion-worker/tests.mjs
